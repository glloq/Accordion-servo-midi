; Build reproductible du firmware.
;
;   pio run -e leonardo_din        ; MIDI DIN seul, soufflet pas a pas (configuration par defaut)
;   pio run -e leonardo_usb        ; MIDI USB natif seul
;   pio run -e leonardo_din_usb    ; les deux (experimental : SRAM tres juste)
;   pio run -e leonardo_din -t upload
;
; La MACHINE est decrite dans accordionV06/config.h, de preference genere par
; tools/configurator/index.html. Les environnements ci-dessous n'ajoutent rien de plus
; qu'une surcharge -D des choix structurants : ils servent a verifier que TOUTES les
; variantes compilent, pas a remplacer le fichier de configuration. Pour la machine reelle,
; c'est config.h qui fait foi et `leonardo_din` (ou `leonardo_usb`) qui doit etre utilise.
;
; Les tests natifs ne passent pas par PlatformIO : voir test/Makefile (`make -C test`).
;
; VERSIONS FIGEES : les bibliotheques sont verrouillees au niveau mineur, et FlexyStepper
; sur un commit precis. Sans cela, une compilation ulterieure pourrait recuperer des
; versions differentes de celles reellement testees.

[platformio]
src_dir = accordionV06
default_envs = leonardo_din

[env]
platform = atmelavr@~5.0.0
board = leonardo
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ~3.0.0
    fortyseveneffects/MIDI Library @ ~5.0.2
    https://github.com/Stan-Reifel/FlexyStepper.git#5ffcd27

; =========================================================================================
; TRANSPORTS MIDI
; =========================================================================================

; === MIDI DIN uniquement (defaut) ===
; Empreinte la plus legere : c'est la configuration a privilegier pour la machine reelle.
[env:leonardo_din]
build_flags = ${env.build_flags} -DMIDI_TRANSPORT_DIN=1 -DMIDI_TRANSPORT_USB=0

; === MIDI USB natif uniquement ===
; Repond a l'objectif "MIDI via USB" du README sans payer le cout du transport DIN.
[env:leonardo_usb]
build_flags = ${env.build_flags} -DMIDI_TRANSPORT_DIN=0 -DMIDI_TRANSPORT_USB=1
lib_deps =
    ${env.lib_deps}
    lathoub/USB-MIDI @ ~1.1.2

; === DIN + USB simultanes (EXPERIMENTAL) ===
; Cette combinaison laisse tres peu de SRAM libre sur l'ATmega32U4. Elle compile et
; fonctionne, mais la marge est trop faible pour une version definitive : preferer
; leonardo_din ou leonardo_usb, ou passer sur un MCU plus large.
[env:leonardo_din_usb]
build_flags = ${env.build_flags} -DMIDI_TRANSPORT_DIN=1 -DMIDI_TRANSPORT_USB=1
lib_deps =
    ${env.lib_deps}
    lathoub/USB-MIDI @ ~1.1.2

; =========================================================================================
; SOURCES D'AIR
; -----------------------------------------------------------------------------------------
; Une seule source est compilee a la fois. Ces environnements verifient que chacune tient
; sur la cible, avec ses propres dependances : une variante qui deborde la FLASH ou la SRAM
; doit se voir en integration continue, pas au moment du montage.
; =========================================================================================

[env:bellow_stepper]
build_flags = ${env:leonardo_din.build_flags} -DAIR_SOURCE=AIR_SOURCE_BELLOW_STEPPER

[env:bellow_servo]
build_flags = ${env:leonardo_din.build_flags} -DAIR_SOURCE=AIR_SOURCE_BELLOW_SERVO

[env:blower_pwm]
build_flags = ${env:leonardo_din.build_flags} -DAIR_SOURCE=AIR_SOURCE_BLOWER_PWM

[env:blower_esc]
build_flags = ${env:leonardo_din.build_flags} -DAIR_SOURCE=AIR_SOURCE_BLOWER_ESC

[env:pump_onoff]
build_flags = ${env:leonardo_din.build_flags} -DAIR_SOURCE=AIR_SOURCE_PUMP_ONOFF

; =========================================================================================
; AUTRES VARIANTES STRUCTURANTES
; =========================================================================================

; Capteur de pression et regulation en boucle fermee, sur le soufflet pas a pas.
[env:pressure_pi]
build_flags = ${env:leonardo_din.build_flags} -DPRESSURE_SENSOR_ENABLED=1

; Pompe a reservoir regulee par hysteresis : c'est la combinaison ou le capteur sert le plus.
[env:pump_regulated]
build_flags = ${env:leonardo_din.build_flags} -DAIR_SOURCE=AIR_SOURCE_PUMP_ONOFF -DPRESSURE_SENSOR_ENABLED=1

; Valves d'anches a electroaimant plutot qu'a servomoteur.
[env:solenoid]
build_flags = ${env:leonardo_din.build_flags} -DNOTE_ACTUATOR=ACTUATOR_SOLENOID

; Routage par point de partage : permet de jouer un fichier MIDI mono-canal.
[env:routing_split]
build_flags = ${env:leonardo_din.build_flags} -DMIDI_ROUTING=MIDI_ROUTING_SPLIT

; Une broche OE par PCA : permet de couper les anches en gardant la valve alimentee.
[env:oe_per_pca]
build_flags = ${env:leonardo_din.build_flags} -DPCA_OE_MODE=PCA_OE_PER_PCA
