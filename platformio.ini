; Build reproductible du firmware.
;
;   pio run -e leonardo            ; MIDI DIN (Serial1) - configuration par defaut
;   pio run -e leonardo_usbmidi    ; MIDI DIN + MIDI USB natif
;   pio run -e leonardo -t upload
;
; Les tests natifs ne passent pas par PlatformIO : voir test/Makefile (`make -C test`).

[platformio]
src_dir = accordionV06
default_envs = leonardo

[env]
platform = atmelavr
board = leonardo
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.0
    fortyseveneffects/MIDI Library @ ^5.0.2
    ; FlexyStepper (Stan Reifel) n'est pas publie sous un nom stable dans le registre
    ; PlatformIO : on pointe directement le depot amont.
    https://github.com/Stan-Reifel/FlexyStepper.git

; === MIDI DIN uniquement (defaut) ===
[env:leonardo]
build_flags = ${env.build_flags} -DMIDI_TRANSPORT_DIN=1 -DMIDI_TRANSPORT_USB=0

; === MIDI DIN + MIDI USB natif ===
; Le README annonce une entree USB : c'est cette configuration qui la fournit.
[env:leonardo_usbmidi]
build_flags = ${env.build_flags} -DMIDI_TRANSPORT_DIN=1 -DMIDI_TRANSPORT_USB=1
lib_deps =
    ${env.lib_deps}
    lathoub/USB-MIDI @ ^1.1.2
