; Build reproductible du firmware.
;
;   pio run -e leonardo_din        ; MIDI DIN seul (configuration par defaut)
;   pio run -e leonardo_usb        ; MIDI USB natif seul
;   pio run -e leonardo_din_usb    ; les deux (experimental : SRAM tres juste)
;   pio run -e leonardo_din -t upload
;
; Les tests natifs ne passent pas par PlatformIO : voir test/Makefile (`make -C test`).
;
; VERSIONS FIGEES : les bibliotheques sont verrouillees au niveau mineur, et FlexyStepper
; sur un commit precis. Sans cela, une compilation ulterieure pourrait recuperer des
; versions differentes de celles reellement testees.

[platformio]
src_dir = accordionV06
default_envs = leonardo_din

[env]
platform = atmelavr@~5.0.0
board = leonardo
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ~3.0.0
    fortyseveneffects/MIDI Library @ ~5.0.2
    https://github.com/Stan-Reifel/FlexyStepper.git#5ffcd27

; === MIDI DIN uniquement (defaut) ===
; Empreinte la plus legere : c'est la configuration a privilegier pour la machine reelle.
[env:leonardo_din]
build_flags = ${env.build_flags} -DMIDI_TRANSPORT_DIN=1 -DMIDI_TRANSPORT_USB=0

; === MIDI USB natif uniquement ===
; Repond a l'objectif "MIDI via USB" du README sans payer le cout du transport DIN.
[env:leonardo_usb]
build_flags = ${env.build_flags} -DMIDI_TRANSPORT_DIN=0 -DMIDI_TRANSPORT_USB=1
lib_deps =
    ${env.lib_deps}
    lathoub/USB-MIDI @ ~1.1.2

; === DIN + USB simultanes (EXPERIMENTAL) ===
; Cette combinaison laisse tres peu de SRAM libre sur l'ATmega32U4. Elle compile et
; fonctionne, mais la marge est trop faible pour une version definitive : preferer
; leonardo_din ou leonardo_usb, ou passer sur un MCU plus large.
[env:leonardo_din_usb]
build_flags = ${env.build_flags} -DMIDI_TRANSPORT_DIN=1 -DMIDI_TRANSPORT_USB=1
lib_deps =
    ${env.lib_deps}
    lathoub/USB-MIDI @ ~1.1.2
